name: Linka
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Linka:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Linka
    info:
      path: Linka/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Linka
        NSCameraUsageDescription: "Used to scan the QR code shown by the device you want to link to as a controller."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.linka
        PRODUCT_NAME: Linka
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      # Built by `./gradlew :core:assembleLinkaCoreXCFramework` from the repo root -
      # run that first, this path won't exist until then. Points at the debug variant
      # for local development; switch to build/XCFrameworks/release for a Release build.
      - framework: ../core/build/XCFrameworks/debug/LinkaCore.xcframework
        embed: true
        sign: true
